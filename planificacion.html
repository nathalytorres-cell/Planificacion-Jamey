<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificación Jamey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef1f5; --card:#ffffff; --ink:#1f2933; --muted:#6b7a86;
  --line:#d8e0e8; --accent:#2f7d8f; --accent-soft:#e3eef1;
  --amb-con:#2f7d8f; --amb-inv:#6b5b95; --amb-vid:#4e8a5a;
  --e-pen:#94a3b8; --e-pro:#d98324; --e-rea:#4e8a5a; --e-blo:#c0554b;
  --sidebar:248px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,h4,.dsp{font-family:'Space Grotesk',Inter,sans-serif}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

/* ---------- Sidebar ---------- */
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;overflow-y:auto}
#brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}
#brand .t{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;line-height:1.25}
#brand .s{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.navsec{padding:10px 8px}
.ambhead{display:flex;align-items:center;gap:7px;width:100%;background:none;border:0;padding:7px 8px;border-radius:7px;
  font-family:'Space Grotesk';font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left}
.ambhead:hover{background:var(--paper)}
.ambdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.ambhead .car{margin-left:auto;font-size:9px;opacity:.6;transition:transform .15s}
.ambhead.closed .car{transform:rotate(-90deg)}
.projlist{margin:2px 0 8px}
.projlist.hidden{display:none}
.proj{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 10px 6px 24px;border-radius:7px;text-align:left;font-size:13px;color:var(--ink)}
.proj:hover{background:var(--paper)}
.proj.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.proj .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .c{font-size:10px;color:var(--muted);background:var(--paper);border-radius:9px;padding:1px 6px;font-variant-numeric:tabular-nums}
.proj.on .c{background:#fff}
.navdiv{height:1px;background:var(--line);margin:6px 12px}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:8px 12px;border-radius:7px;text-align:left;font-size:13px}
.navbtn:hover{background:var(--paper)}
.navbtn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#syncbox{margin-top:auto;padding:12px;border-top:1px solid var(--line)}
#syncbtn{width:100%;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px;font-weight:600;font-size:13px}
#syncbtn:hover{filter:brightness(1.08)}
#syncbtn:disabled{opacity:.6;cursor:default}
#syncinfo{font-size:10.5px;color:var(--muted);text-align:center;margin-top:6px;min-height:14px}

/* ---------- Main ---------- */
#main{margin-left:var(--sidebar);padding:22px 26px 70px;max-width:1180px}
#head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
#head h1{margin:0;font-size:25px;font-weight:600;letter-spacing:-.01em}
#head .badge{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;color:#fff}
#head .sub{color:var(--muted);font-size:13px;margin-left:auto}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.metric .v{font-family:'Space Grotesk';font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.metric .l{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.03em}
.metric.warn .v{color:var(--e-pro)}

#toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.field{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;outline:none}
.field:focus{border-color:var(--accent)}
#q{flex:1;min-width:170px}
.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:#fff}

.subgroup{margin:18px 0 8px;font-family:'Space Grotesk';font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

/* ---------- Cards ---------- */
.act{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:9px;overflow:hidden}
.act.open{border-color:#b9c8d4;box-shadow:0 2px 12px rgba(31,41,51,.06)}
.arow{display:flex;align-items:center;gap:11px;padding:11px 14px}
.arow:hover{background:#fafbfc}
.car{width:15px;color:var(--muted);font-size:10px;flex:0 0 15px;text-align:center;transition:transform .15s;cursor:pointer}
.act.open .car{transform:rotate(90deg)}
.chip{font-size:10.5px;font-weight:600;padding:2.5px 9px;border-radius:20px;color:#fff;white-space:nowrap;border:0;letter-spacing:.02em}
.chip.Pendiente{background:var(--e-pen)}
.chip.proceso{background:var(--e-pro)} .chip.Realizada{background:var(--e-rea)} .chip.Bloqueada{background:var(--e-blo)}
.aname{flex:1;font-weight:500;min-width:0}
.aname .txt{cursor:pointer}
.aname .rt{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
.who{font-size:11.5px;font-weight:600;padding:2.5px 9px;border-radius:20px;background:var(--paper);color:var(--muted);white-space:nowrap}
.who.p0{background:#e3eef1;color:#26697a} .who.p1{background:#efe8f5;color:#5d4d87}
.who.p2{background:#e6f0e8;color:#3d7049} .who.p3{background:#fdeee0;color:#a8641b}
.who.p4{background:#fae8e6;color:#a8443c} .who.p5{background:#e8ecf5;color:#4a5c8a}
.fecha{font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.fecha.late{color:var(--e-blo);font-weight:600}
.fecha.soon{color:var(--e-pro);font-weight:600}
.prio{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.prio.Alta{color:var(--e-blo)}
.mini{background:none;border:0;color:var(--muted);font-size:12px;padding:2px 4px;border-radius:5px;opacity:.55}
.mini:hover{opacity:1;background:var(--paper);color:var(--accent)}

.body{border-top:1px solid var(--line);padding:14px 14px 16px;background:#fbfcfd}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:13px}
.lab{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.inp{width:100%;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:52px}
.secttl{font-family:'Space Grotesk';font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px;display:flex;align-items:center;gap:8px}
.secttl:after{content:"";flex:1;height:1px;background:var(--line)}

.tar{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
.trow{display:flex;align-items:center;gap:9px;padding:8px 11px}
.tbody{border-top:1px solid var(--line);padding:10px 11px 12px;background:#fbfcfd}
.paso{display:flex;align-items:center;gap:8px;padding:5px 0 5px 6px;border-bottom:1px dashed var(--line)}
.paso:last-child{border-bottom:0}
.paso .pt{flex:1;font-size:13px}
.paso.done .pt{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1}

.cmt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.cmt .m{font-size:10.5px;color:var(--muted);margin-bottom:3px}

.empty{background:var(--card);border:1px dashed var(--line);border-radius:11px;padding:34px;text-align:center;color:var(--muted)}

/* ---------- Modal ---------- */
.mask{position:fixed;inset:0;background:rgba(31,41,51,.42);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:40px 16px;overflow-y:auto}
.mask.on{display:flex}
.modal{background:#fff;border-radius:13px;width:100%;max-width:560px;padding:20px 22px 22px;box-shadow:0 18px 50px rgba(31,41,51,.24)}
.modal h3{margin:0 0 4px;font-size:17px;font-weight:600}
.modal .hint{color:var(--muted);font-size:12.5px;margin:0 0 15px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.prow input{flex:1}
.chkline{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:13px}

/* ---------- Por persona ---------- */
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.col{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px}
.colh{font-family:'Space Grotesk';font-weight:600;font-size:13px;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.colh .c{margin-left:auto;font-size:10.5px;color:var(--muted);background:var(--paper);border-radius:9px;padding:1px 7px}
.pitem{border-top:1px solid var(--line);padding:8px 0}
.pitem .rt{font-size:10.5px;color:var(--muted)}
.pitem .tt{font-size:13px;margin:2px 0}
.tipo{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---------- Print ---------- */
#printarea{display:none}
@media print{
  #sidebar,#main,.mask{display:none !important}
  #printarea{display:block;padding:0}
  body{background:#fff;font-size:11.5px}
  .pr-h1{font-family:'Space Grotesk';font-size:19px;margin:0 0 2px;letter-spacing:.06em;text-transform:uppercase}
  .pr-meta{color:#666;font-size:10.5px;margin-bottom:14px}
  .pr-sec{font-family:'Space Grotesk';font-size:13px;margin:16px 0 6px;padding-bottom:3px;border-bottom:1.5px solid #333;page-break-after:avoid}
  .pr-act{margin:0 0 9px;padding-left:2px;page-break-inside:avoid}
  .pr-act .ttl{font-weight:600}
  .pr-act .mt{color:#555;font-size:10.5px}
  .pr-tar{margin-left:16px;font-size:11px}
  .pr-paso{margin-left:32px;font-size:10.5px;color:#444}
}
@media (max-width:820px){
  #sidebar{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  #main{margin-left:0;padding:16px}
  .metrics{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<script>
"use strict";
/* ============================================================
   Planificación Jamey — herramienta unificada
   Jerarquía:  Ámbito > Proyecto > Actividad > Tarea > Paso
   En el código:  registro (proceso) > actividades[] > tareas[]
   ============================================================ */

const KEY_DATA = 'planjamey.data.v1';
const KEY_URL  = 'planjamey.url.v1';
const KEY_SYNC = 'planjamey.lastsync.v1';

const AMBITOS = ['Consultorías','Investigación','Vida personal'];
const AMB_COLOR = {'Consultorías':'var(--amb-con)','Investigación':'var(--amb-inv)','Vida personal':'var(--amb-vid)'};
const ESTADOS = ['Pendiente','En proceso','Realizada','Bloqueada'];
const PRIOS = ['Alta','Media','Baja'];

let D = [];
let VIEW = { mode:'proyecto', proyecto:'__todos__' };
let OPEN = new Set(), OPENT = new Set();
let FILTRO = { q:'', estado:'', resp:'' };
let AMB_CLOSED = new Set();

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const now = () => Date.now();
const uid = p => p + '-' + now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date().toISOString().slice(0,10);
function diasHasta(f){ if(!f) return null; const a=new Date(f+'T00:00:00'), b=new Date(hoy()+'T00:00:00'); return Math.round((a-b)/86400000); }
function fmtFecha(f,h){ if(!f) return ''; const [y,m,d]=f.split('-'); const s=d+'/'+m; return h? s+' '+h : s; }
const estCls = e => e==='En proceso' ? 'proceso' : e;

/* ---------- datos ---------- */
const procesos = () => D.filter(r => r._kind!=='person' && !r._del);
const tars  = r => (r.actividades||[]).filter(t => !t._del);
const pasos = t => (t.tareas||[]).filter(p => !p._del);
const personas = () => D.filter(r => r._kind==='person' && !r._del).sort((a,b)=>a.nombre.localeCompare(b.nombre));
const nombresPersonas = () => personas().map(p=>p.nombre);

function ambitoDe(proy){
  const r = procesos().find(x => x.cat===proy && x.ambito);
  return r ? r.ambito : 'Consultorías';
}
function proyectosPorAmbito(){
  const m = {}; AMBITOS.forEach(a => m[a] = []);
  procesos().forEach(r => {
    const a = AMBITOS.includes(r.ambito) ? r.ambito : 'Consultorías';
    if(!m[a].includes(r.cat)) m[a].push(r.cat);
  });
  AMBITOS.forEach(a => m[a].sort((x,y)=>x.localeCompare(y)));
  return m;
}
function personIdx(nombre){
  const i = nombresPersonas().indexOf(nombre);
  return i < 0 ? '' : 'p' + (i % 6);
}

/* ---------- estados en cascada ---------- */
function roll(list){
  if(!list.length) return 'Pendiente';
  if(list.every(e => e==='Realizada')) return 'Realizada';
  if(list.some(e => e==='Bloqueada')) return 'Bloqueada';
  if(list.some(e => e==='En proceso' || e==='Realizada')) return 'En proceso';
  return 'Pendiente';
}
function estPaso(p){ return p.estado || (p.done ? 'Realizada' : 'Pendiente'); }
function estTarea(t){
  if(t.estadoManual) return t.estadoManual;
  const ps = pasos(t);
  return ps.length ? roll(ps.map(estPaso)) : (t.estado || 'Pendiente');
}
function estActividad(r){
  if(r.estadoManual) return r.estadoManual;
  const ts = tars(r);
  return ts.length ? roll(ts.map(estTarea)) : (r.estadoBase || 'Pendiente');
}

/* ---------- persistencia ---------- */
function guardar(){ try{ localStorage.setItem(KEY_DATA, JSON.stringify(D)); }catch(e){ console.warn(e); } }
function cargar(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY_DATA); }catch(e){}
  if(raw){ try{ D = JSON.parse(raw); return; }catch(e){} }
  D = JSON.parse($('#seed').textContent);
  guardar();
}
function touch(r){ r._m = now(); guardar(); }

/* ---------- alcance visible ---------- */
function enAlcance(){
  let list = procesos();
  if(VIEW.proyecto !== '__todos__') list = list.filter(r => r.cat === VIEW.proyecto);
  if(FILTRO.estado) list = list.filter(r => estActividad(r) === FILTRO.estado);
  if(FILTRO.resp) list = list.filter(r => {
    const dentro = tars(r).some(t => t.resp===FILTRO.resp || pasos(t).some(p=>p.resp===FILTRO.resp));
    return r.resp===FILTRO.resp || (r.invol||'').includes(FILTRO.resp) || dentro;
  });
  if(FILTRO.q){
    const q = FILTRO.q.toLowerCase();
    list = list.filter(r => {
      const blob = [r.nombre,r.desc,r.notas,r.cat,r.sub,r.resp,r.invol,
        ...tars(r).map(t=>t.nombre),
        ...tars(r).flatMap(t=>pasos(t).map(p=>p.txt))].join(' ').toLowerCase();
      return blob.includes(q);
    });
  }
  return list;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){ renderNav(); renderHead(); renderMetrics(); renderToolbar(); renderContent(); }

function renderNav(){
  const m = proyectosPorAmbito();
  let h = `<button class="proj ${VIEW.proyecto==='__todos__'&&VIEW.mode==='proyecto'?'on':''}" data-proy="__todos__" style="padding-left:10px;font-weight:600">
    <span class="n">Todo</span><span class="c">${procesos().length}</span></button>`;
  AMBITOS.forEach(a => {
    const proys = m[a]; if(!proys.length) return;
    const closed = AMB_CLOSED.has(a);
    h += `<button class="ambhead ${closed?'closed':''}" data-amb="${esc(a)}">
        <span class="ambdot" style="background:${AMB_COLOR[a]}"></span>${esc(a)}<span class="car">▼</span></button>
      <div class="projlist ${closed?'hidden':''}">`;
    proys.forEach(p => {
      const n = procesos().filter(r => r.cat===p).length;
      const pend = procesos().filter(r => r.cat===p && estActividad(r)!=='Realizada').length;
      const on = VIEW.mode==='proyecto' && VIEW.proyecto===p;
      h += `<button class="proj ${on?'on':''}" data-proy="${esc(p)}"><span class="n">${esc(p)}</span><span class="c">${pend}/${n}</span></button>`;
    });
    h += `</div>`;
  });
  $('#nav').innerHTML = h;
  document.querySelectorAll('.navbtn[data-go]').forEach(b => b.classList.toggle('on', VIEW.mode===b.dataset.go));
}

function renderHead(){
  if(VIEW.mode==='personas'){ $('#head').innerHTML = `<h1>Personas</h1><div class="sub">${personas().length} registradas</div>`; return; }
  if(VIEW.mode==='persona'){ $('#head').innerHTML = `<h1>Por persona</h1><div class="sub">Reparto del trabajo en los tres niveles</div>`; return; }
  const p = VIEW.proyecto;
  if(p==='__todos__'){ $('#head').innerHTML = `<h1>Todo</h1><div class="sub">${procesos().length} actividades en ${Object.values(proyectosPorAmbito()).flat().length} proyectos</div>`; return; }
  const a = ambitoDe(p);
  $('#head').innerHTML = `<h1>${esc(p)}</h1><span class="badge" style="background:${AMB_COLOR[a]}">${esc(a)}</span>
    <div class="sub">${procesos().filter(r=>r.cat===p).length} actividades</div>`;
}

function itemsConFecha(list){
  const out = [];
  list.forEach(r => {
    out.push({obj:r.obj, est:estActividad(r)});
    tars(r).forEach(t => {
      out.push({obj:t.obj, est:estTarea(t)});
      pasos(t).forEach(p => out.push({obj:p.obj, est:estPaso(p)}));
    });
  });
  return out;
}
function renderMetrics(){
  if(VIEW.mode!=='proyecto'){ $('#metrics').innerHTML=''; return; }
  const list = VIEW.proyecto==='__todos__' ? procesos() : procesos().filter(r=>r.cat===VIEW.proyecto);
  const proc = list.filter(r=>estActividad(r)==='En proceso').length;
  const done = list.filter(r=>estActividad(r)==='Realizada').length;
  const bloq = list.filter(r=>estActividad(r)==='Bloqueada').length;
  const venc = itemsConFecha(list).filter(i => i.est!=='Realizada' && i.obj && diasHasta(i.obj)!==null && diasHasta(i.obj)<=7).length;
  const cards = [
    ['v', list.length - done, 'Actividades abiertas'],
    ['v', proc, 'En proceso'],
    ['w', venc, 'Atrasadas o vencen esta semana'],
    ['v', done + (bloq?0:0), 'Realizadas']
  ];
  $('#metrics').innerHTML = cards.map(c =>
    `<div class="metric ${c[0]==='w'&&c[1]>0?'warn':''}"><div class="v">${c[1]}</div><div class="l">${c[2]}</div></div>`).join('');
}

function renderToolbar(){
  if(VIEW.mode==='personas'){ $('#toolbar').innerHTML=''; return; }
  if(VIEW.mode==='persona'){ $('#toolbar').innerHTML = `<button class="btn" id="tbPrintPer">🖨 Imprimir este reparto</button>`; return; }
  const ops = e => ESTADOS.map(x=>`<option ${FILTRO.estado===x?'selected':''}>${x}</option>`).join('');
  $('#toolbar').innerHTML = `
    <input class="field" id="q" placeholder="Buscar en actividades, tareas y pasos…" value="${esc(FILTRO.q)}">
    <select class="field" id="fEst"><option value="">Todos los estados</option>${ops()}</select>
    <select class="field" id="fResp"><option value="">Cualquier responsable</option>
      ${nombresPersonas().map(n=>`<option ${FILTRO.resp===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
    <button class="btn pri" id="btnNueva">+ Nueva actividad</button>`;
}

function renderContent(){
  if(VIEW.mode==='personas') return renderPersonas();
  if(VIEW.mode==='persona')  return renderPorPersona();
  const list = enAlcance();
  if(!list.length){
    $('#content').innerHTML = `<div class="empty">No hay actividades que coincidan.<br><br>
      <button class="btn pri" id="btnNueva2">+ Crear la primera</button></div>`;
    const b=$('#btnNueva2'); if(b) b.onclick = nuevaActividad;
    return;
  }
  const porGrupo = {};
  list.forEach(r => {
    const g = VIEW.proyecto==='__todos__' ? (r.ambito||'Consultorías')+' · '+r.cat : (r.sub || '');
    (porGrupo[g] = porGrupo[g] || []).push(r);
  });
  let h = '';
  Object.keys(porGrupo).sort().forEach(g => {
    if(g) h += `<div class="subgroup">${esc(g)}</div>`;
    porGrupo[g].sort(ordenar).forEach(r => h += cardActividad(r));
  });
  $('#content').innerHTML = h;
}
function ordenar(a,b){
  const ea = estActividad(a)==='Realizada' ? 1 : 0, eb = estActividad(b)==='Realizada' ? 1 : 0;
  if(ea!==eb) return ea-eb;
  if(a.obj && b.obj) return a.obj.localeCompare(b.obj);
  if(a.obj) return -1; if(b.obj) return 1;
  return (a.nombre||'').localeCompare(b.nombre||'');
}

function fechaCls(f,est){
  if(!f || est==='Realizada') return '';
  const d = diasHasta(f);
  if(d===null) return '';
  return d < 0 ? 'late' : (d <= 7 ? 'soon' : '');
}
function selEstado(val, tipo, id, sub){
  return `<select class="chip ${estCls(val)}" data-est="${tipo}" data-id="${id}" ${sub?`data-sub="${sub}"`:''}
    style="appearance:none;-webkit-appearance:none;padding-right:9px">
    ${ESTADOS.map(e=>`<option ${e===val?'selected':''}>${e}</option>`).join('')}</select>`;
}
function selResp(val, tipo, id, sub){
  const nombres = nombresPersonas();
  const extra = val && !nombres.includes(val) ? `<option selected>${esc(val)}</option>` : '';
  return `<select class="inp" data-resp="${tipo}" data-id="${id}" ${sub?`data-sub="${sub}"`:''}>
    <option value="">— sin asignar —</option>${extra}
    ${nombres.map(n=>`<option ${n===val?'selected':''}>${esc(n)}</option>`).join('')}
    <option value="__otro__">✎ Escribir otro…</option></select>`;
}

function cardActividad(r){
  const est = estActividad(r), abierta = OPEN.has(r.id);
  const ts = tars(r);
  const hechas = ts.filter(t=>estTarea(t)==='Realizada').length;
  let h = `<div class="act ${abierta?'open':''}" data-card="${r.id}">
    <div class="arow">
      <span class="car" data-toggle="${r.id}">▶</span>
      ${selEstado(est,'act',r.id)}
      <div class="aname"><span class="txt" data-toggle="${r.id}" data-edit="actname" data-id="${r.id}">${esc(r.nombre)}</span>
        <span class="rt">${esc(r.cat)}${r.sub?' · '+esc(r.sub):''}${ts.length?` · ${hechas}/${ts.length} tareas`:''}</span></div>
      ${r.prio ? `<span class="prio ${esc(r.prio)}">${esc(r.prio)}</span>` : ''}
      ${r.resp ? `<span class="who ${personIdx(r.resp)}">${esc(r.resp)}</span>` : ''}
      ${r.obj ? `<span class="fecha ${fechaCls(r.obj,est)}">${fmtFecha(r.obj,r.objH)}</span>` : ''}
      <button class="mini" data-edit="actname" data-id="${r.id}" title="Renombrar">✎</button>
      <button class="mini" data-del="${r.id}" title="Eliminar">✕</button>
    </div>`;
  if(abierta) h += cuerpoActividad(r);
  return h + `</div>`;
}

function cuerpoActividad(r){
  let h = `<div class="body">
    <div class="grid">
      <div><label class="lab">Proyecto</label>
        <select class="inp" data-f="cat" data-id="${r.id}">
          ${Object.values(proyectosPorAmbito()).flat().map(p=>`<option ${p===r.cat?'selected':''}>${esc(p)}</option>`).join('')}
          <option value="__nuevo__">+ Nuevo proyecto…</option></select></div>
      <div><label class="lab">Subgrupo</label><input class="inp" data-f="sub" data-id="${r.id}" value="${esc(r.sub||'')}" placeholder="opcional"></div>
      <div><label class="lab">Responsable</label>${selResp(r.resp,'act',r.id)}</div>
      <div><label class="lab">Involucrados</label><input class="inp" data-f="invol" data-id="${r.id}" value="${esc(r.invol||'')}"></div>
      <div><label class="lab">Inicio</label><input class="inp" type="date" data-f="ini" data-id="${r.id}" value="${r.ini||''}"></div>
      <div><label class="lab">Fecha objetivo</label>
        <div style="display:flex;gap:5px">
          <input class="inp" type="date" data-f="obj" data-id="${r.id}" value="${r.obj||''}">
          <input class="inp" type="time" style="max-width:88px" data-f="objH" data-id="${r.id}" value="${r.objH||''}"></div></div>
      <div><label class="lab">Prioridad</label><select class="inp" data-f="prio" data-id="${r.id}">
        ${PRIOS.map(p=>`<option ${p===r.prio?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
    </div>
    <div><label class="lab">Descripción</label><textarea class="inp" data-f="desc" data-id="${r.id}">${esc(r.desc||'')}</textarea></div>
    <div style="margin-top:10px"><label class="lab">Notas</label><textarea class="inp" data-f="notas" data-id="${r.id}">${esc(r.notas||'')}</textarea></div>

    <div class="secttl">Tareas</div>`;
  tars(r).forEach(t => h += cardTarea(r,t));
  h += `<div class="addrow"><input class="inp" data-newtar="${r.id}" placeholder="Nueva tarea…">
        <button class="btn" data-addtar="${r.id}">+ Agregar</button></div>`;

  h += `<div class="secttl">Comentarios</div>`;

/* ============================================================
   BÚSQUEDA DE OBJETOS
   ============================================================ */
const getAct = id => procesos().find(r => r.id===id);
const getTar = (rid,tid) => { const r=getAct(rid); return r && (r.actividades||[]).find(t=>t.id===tid); };
const getPaso = (rid,tid,pid) => { const t=getTar(rid,tid); return t && (t.tareas||[]).find(p=>p.id===pid); };

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target;

  const amb = t.closest('.ambhead');
  if(amb){ const a = amb.dataset.amb; AMB_CLOSED.has(a) ? AMB_CLOSED.delete(a) : AMB_CLOSED.add(a); renderNav(); return; }

  const proj = t.closest('.proj');
  if(proj){ VIEW = {mode:'proyecto', proyecto:proj.dataset.proy}; render(); window.scrollTo(0,0); return; }

  const go = t.closest('.navbtn[data-go]');
  if(go){ VIEW.mode = go.dataset.go; render(); window.scrollTo(0,0); return; }

  if(t.dataset.toggle){ const id=t.dataset.toggle; OPEN.has(id)?OPEN.delete(id):OPEN.add(id); renderContent(); return; }
  if(t.dataset.togglet){ const id=t.dataset.togglet; OPENT.has(id)?OPENT.delete(id):OPENT.add(id); renderContent(); return; }

  if(t.dataset.edit){ editarNombre(t.dataset.edit, t.dataset.id, t.dataset.sub, t.dataset.pid); return; }

  if(t.dataset.del){
    const r = getAct(t.dataset.del);
    if(r && confirm('¿Eliminar la actividad «'+r.nombre+'» con todas sus tareas y pasos?')){
      r._del = true; touch(r); render();
    } return;
  }
  if(t.dataset.deltar){
    const r = getAct(t.dataset.sub);
    const tar = getTar(t.dataset.sub, t.dataset.deltar);
    if(r && tar && confirm('¿Eliminar esta tarea y sus pasos?')){
      tar._del = true; tar._m = now(); touch(r); renderContent();
    } return;
  }
  if(t.dataset.addtar){
    const inp = document.querySelector(`[data-newtar="${t.dataset.addtar}"]`);
    agregarTarea(t.dataset.addtar, inp.value); return;
  }
  if(t.dataset.addpaso){
    const inp = document.querySelector(`[data-newpaso="${t.dataset.addpaso}"]`);
    agregarPaso(t.dataset.sub, t.dataset.addpaso, inp.value); return;
  }
  if(t.dataset.pdel){
    const tar = getTar(t.dataset.sub, t.dataset.pdel);
    const p = getPaso(t.dataset.sub, t.dataset.pdel, t.dataset.pid);
    if(p){ p._del = true; p._m = now(); tar._m = now(); touch(getAct(t.dataset.sub)); renderContent(); }
    return;
  }
  if(t.dataset.pedit){ detallePaso(t.dataset.sub, t.dataset.pedit, t.dataset.pid); return; }
  if(t.dataset.addcmt){
    const id = t.dataset.addcmt;
    const inp = document.querySelector(`[data-newcmt="${id}"]`);
    const who = document.querySelector(`[data-cmtwho="${id}"]`);
    if(inp.value.trim()){
      const r = getAct(id); r.comments = r.comments||[];
      r.comments.push({autor:who.value, fecha:hoy(), txt:inp.value.trim()});
      touch(r); renderContent();
    } return;
  }
  if(t.dataset.delcmt){
    const r = getAct(t.dataset.delcmt); r.comments.splice(+t.dataset.i,1); touch(r); renderContent(); return;
  }
  if(t.id==='btnNueva') return nuevaActividad();
  if(t.id==='tbPrintPer') return imprimir({tipo:'persona', personas:nombresPersonas(), alcance:'__todos__'});
});

document.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-edit]');
  if(el) editarNombre(el.dataset.edit, el.dataset.id, el.dataset.sub, el.dataset.pid);
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='fEst'){ FILTRO.estado=t.value; renderContent(); return; }
  if(t.id==='fResp'){ FILTRO.resp=t.value; renderContent(); return; }

  if(t.dataset.est){
    const tipo = t.dataset.est;
    if(tipo==='act'){ const r=getAct(t.dataset.id); r.estadoManual=t.value; r.estadoBase=t.value; touch(r); }
    else { const r=getAct(t.dataset.sub), tar=getTar(t.dataset.sub,t.dataset.id); tar.estadoManual=t.value; tar.estado=t.value; tar._m=now(); touch(r); }
    render(); return;
  }
  if(t.dataset.resp){
    let v = t.value;
    if(v==='__otro__'){ v = prompt('Nombre del responsable:') || ''; }
    if(t.dataset.resp==='act'){ const r=getAct(t.dataset.id); r.resp=v; touch(r); }
    else { const r=getAct(t.dataset.sub), tar=getTar(t.dataset.sub,t.dataset.id); tar.resp=v; tar._m=now(); touch(r); }
    renderContent(); return;
  }
  if(t.dataset.f){
    const r = getAct(t.dataset.id);
    if(t.dataset.f==='cat' && t.value==='__nuevo__'){
      const n = prompt('Nombre del nuevo proyecto:');
      if(!n){ renderContent(); return; }
      const a = prompt('¿En qué ámbito? Escribe: Consultorías, Investigación o Vida personal','Consultorías');
      r.cat = n.trim(); r.ambito = AMBITOS.includes((a||'').trim()) ? a.trim() : 'Consultorías';
    } else {
      r[t.dataset.f] = t.value || (['ini','obj','objH'].includes(t.dataset.f) ? null : '');
      if(t.dataset.f==='cat') r.ambito = ambitoDe(t.value);
    }
    touch(r); render(); return;
  }
  if(t.dataset.ft){
    const r = getAct(t.dataset.sub), tar = getTar(t.dataset.sub, t.dataset.id);
    tar[t.dataset.ft] = t.value || (['ini','obj','objH'].includes(t.dataset.ft) ? null : '');
    tar._m = now(); touch(r); renderContent(); return;
  }
  if(t.dataset.pchk){
    const r = getAct(t.dataset.sub), tar = getTar(t.dataset.sub, t.dataset.pchk);
    const p = getPaso(t.dataset.sub, t.dataset.pchk, t.dataset.pid);
    p.done = t.checked; p.estado = t.checked ? 'Realizada' : 'Pendiente'; p._m = now();
    tar._m = now(); touch(r); render(); return;
  }
});

document.addEventListener('input', e => {
  if(e.target.id==='q'){ FILTRO.q = e.target.value; clearTimeout(window._qt); window._qt=setTimeout(renderContent,180); }
});
document.addEventListener('keydown', e => {
  if(e.key!=='Enter') return;
  const t = e.target;
  if(t.dataset.newtar) agregarTarea(t.dataset.newtar, t.value);
  else if(t.dataset.newpaso) agregarPaso(t.dataset.sub, t.dataset.newpaso, t.value);
  else if(t.dataset.newcmt) document.querySelector(`[data-addcmt="${t.dataset.newcmt}"]`).click();
});

/* ---------- edición de nombres ---------- */
function editarNombre(tipo, id, sub, pid){
  if(tipo==='actname'){
    const r = getAct(id); const v = prompt('Nombre de la actividad:', r.nombre);
    if(v!==null && v.trim()){ r.nombre = v.trim(); touch(r); render(); }
  } else if(tipo==='tarname'){
    const r = getAct(sub), tar = getTar(sub,id); const v = prompt('Nombre de la tarea:', tar.nombre);
    if(v!==null && v.trim()){ tar.nombre = v.trim(); tar._m=now(); touch(r); renderContent(); }
  } else if(tipo==='pasoname'){
    const r = getAct(sub), tar = getTar(sub,id); const p = getPaso(sub,id,pid);
    const v = prompt('Texto del paso:', p.txt);
    if(v!==null && v.trim()){ p.txt = v.trim(); p._m=now(); tar._m=now(); touch(r); renderContent(); }
  }
}

function agregarTarea(rid, txt){
  if(!txt || !txt.trim()) return;
  const r = getAct(rid);
  r.actividades = r.actividades || [];
  r.actividades.push({id:uid('A'), nombre:txt.trim(), estado:'Pendiente', estadoManual:null,
    resp:r.resp||'', invol:'', ini:null, obj:null, objH:null, tareas:[], _m:now()});
  touch(r); renderContent();
  const inp = document.querySelector(`[data-newtar="${rid}"]`); if(inp) inp.focus();
}
function agregarPaso(rid, tid, txt){
  if(!txt || !txt.trim()) return;
  const r = getAct(rid), tar = getTar(rid,tid);
  tar.tareas = tar.tareas || [];
  tar.tareas.push({id:uid('S'), txt:txt.trim(), done:false, estado:'Pendiente',
    resp:tar.resp||'', invol:'', ini:null, obj:null, objH:null, _m:now()});
  tar._m = now(); touch(r); renderContent();
  const inp = document.querySelector(`[data-newpaso="${tid}"]`); if(inp) inp.focus();
}

/* ============================================================
   POR PERSONA
   ============================================================ */
function repartoPorPersona(alcance){
  const cols = {}; nombresPersonas().forEach(n => cols[n]=[]); cols['Sin asignar']=[];
  const push = (quien,item) => { const k = quien && cols[quien]!==undefined ? quien : (quien ? (cols[quien]=cols[quien]||[], quien) : 'Sin asignar'); cols[k].push(item); };
  let list = procesos();
  if(alcance && alcance!=='__todos__') list = list.filter(r => r.cat===alcance);
  list.forEach(r => {
    const e = estActividad(r);
    if(e!=='Realizada') push(r.resp, {tipo:'Actividad', txt:r.nombre, ruta:r.cat+(r.sub?' · '+r.sub:''), obj:r.obj, objH:r.objH, est:e});
    tars(r).forEach(t => {
      const et = estTarea(t);
      if(et!=='Realizada') push(t.resp, {tipo:'Tarea', txt:t.nombre, ruta:r.cat+' › '+r.nombre, obj:t.obj, objH:t.objH, est:et});
      pasos(t).forEach(p => {
        const ep = estPaso(p);
        if(ep!=='Realizada') push(p.resp, {tipo:'Paso', txt:p.txt, ruta:r.nombre+' › '+t.nombre, obj:p.obj, objH:p.objH, est:ep});
      });
    });
  });
  Object.values(cols).forEach(a => a.sort((x,y)=> (x.obj||'9999').localeCompare(y.obj||'9999')));
  return cols;
}
function renderPorPersona(){
  const cols = repartoPorPersona(null);
  $('#content').innerHTML = `<div class="cols">` + Object.keys(cols).map(k => {
    const items = cols[k];
    return `<div class="col"><div class="colh"><span class="who ${personIdx(k)}">${esc(k)}</span><span class="c">${items.length}</span></div>
      ${items.length ? items.map(i=>`<div class="pitem">
        <div class="tipo">${i.tipo}</div>
        <div class="tt">${esc(i.txt)}</div>
        <div class="rt">${esc(i.ruta)}${i.obj?' · <b>'+fmtFecha(i.obj,i.objH)+'</b>':''}</div></div>`).join('')
      : `<div style="color:var(--muted);font-size:12.5px;padding:8px 0">Nada pendiente.</div>`}</div>`;
  }).join('') + `</div>`;
}

    <div class="chkline"><input type="radio" name="pm" id="pm5" value="persona"><label for="pm5">Reporte por persona</label></div>
    <div id="pmPersonas" style="display:none;padding:6px 0 0 22px;border-left:2px solid var(--line);margin-left:6px">
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:5px">¿Quiénes?</div>
      ${nombresPersonas().concat(['Sin asignar']).map(n=>`<div class="chkline"><input type="checkbox" class="pchkp" value="${esc(n)}" checked><label>${esc(n)}</label></div>`).join('')}
      <div style="font-size:11.5px;color:var(--muted);margin:8px 0 5px">¿De qué alcance?</div>
      <select class="inp" id="pmAlc"><option value="${esc(VIEW.proyecto)}">${VIEW.proyecto==='__todos__'?'Todo':esc(VIEW.proyecto)}</option>
        <option value="__todos__">Todo</option>${proys.map(p=>`<option>${esc(p)}</option>`).join('')}</select>
    </div>
    <div class="mfoot"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="pmOk">Imprimir</button></div>`);
  document.querySelectorAll('input[name=pm]').forEach(r => r.onchange = () => {
    $('#pmPersonas').style.display = $('#pm5').checked ? 'block' : 'none'; });
  $('#pmOk').onclick = () => {
    const modo = document.querySelector('input[name=pm]:checked').value;
    if(modo==='persona'){
      const who = [...document.querySelectorAll('.pchkp:checked')].map(c=>c.value);
      imprimir({tipo:'persona', personas:who, alcance:$('#pmAlc').value});
    } else if(modo==='actual') imprimir({tipo:'proy', proy:VIEW.proyecto});
    else if(modo==='uno') imprimir({tipo:'proy', proy:$('#pmProy').value});
    else if(modo==='ambito') imprimir({tipo:'ambito', amb:$('#pmAmb').value});
    else imprimir({tipo:'proy', proy:'__todos__'});
  };
};

function imprimir(cfg){
  cerrarModal();
  const f = new Date().toLocaleDateString('es-DO',{day:'2-digit',month:'long',year:'numeric'});
  let h = '';
  if(cfg.tipo==='persona'){
    const cols = repartoPorPersona(cfg.alcance);
    h = `<div class="pr-h1">Planificación Jamey — reparto por persona</div>
      <div class="pr-meta">${cfg.alcance==='__todos__'?'Todos los proyectos':esc(cfg.alcance)} · ${f}</div>`;
    cfg.personas.forEach(n => {
      const items = cols[n] || [];
      h += `<div class="pr-sec">${esc(n)} — ${items.length} pendientes</div>`;
      h += items.length ? items.map(i=>`<div class="pr-act"><span class="ttl">${esc(i.txt)}</span>
        <div class="mt">${i.tipo} · ${esc(i.ruta)} · ${i.est}${i.obj?' · objetivo '+fmtFecha(i.obj,i.objH):''}</div></div>`).join('')
        : `<div class="pr-act mt">Nada pendiente.</div>`;
    });
  } else {
    let list = procesos(), titulo = 'Todo';
    if(cfg.tipo==='ambito'){ list = list.filter(r=>(r.ambito||'Consultorías')===cfg.amb); titulo = cfg.amb; }
    else if(cfg.proy && cfg.proy!=='__todos__'){ list = list.filter(r=>r.cat===cfg.proy); titulo = cfg.proy; }
    h = `<div class="pr-h1">Planificación Jamey — ${esc(titulo)}</div><div class="pr-meta">${list.length} actividades · ${f}</div>`;
    const grupos = {};
    list.forEach(r => (grupos[r.cat] = grupos[r.cat]||[]).push(r));
    Object.keys(grupos).sort().forEach(g => {
      h += `<div class="pr-sec">${esc(g)}</div>`;
      grupos[g].sort(ordenar).forEach(r => {
        h += `<div class="pr-act"><span class="ttl">[${estActividad(r)}] ${esc(r.nombre)}</span>
          <div class="mt">${r.resp?'Responsable: '+esc(r.resp)+' · ':''}${r.invol?'Con: '+esc(r.invol)+' · ':''}${r.obj?'Objetivo '+fmtFecha(r.obj,r.objH)+' · ':''}Prioridad ${esc(r.prio||'—')}</div>
          ${r.desc?`<div class="mt">${esc(r.desc)}</div>`:''}
          ${r.notas?`<div class="mt"><i>Notas: ${esc(r.notas)}</i></div>`:''}</div>`;
        tars(r).forEach(t => {
          h += `<div class="pr-tar">• [${estTarea(t)}] ${esc(t.nombre)}${t.resp?' — '+esc(t.resp):''}${t.obj?' — '+fmtFecha(t.obj,t.objH):''}</div>`;
          pasos(t).forEach(p => h += `<div class="pr-paso">– [${estPaso(p)}] ${esc(p.txt)}${p.resp?' — '+esc(p.resp):''}${p.obj?' — '+fmtFecha(p.obj,p.objH):''}</div>`);
        });
      });
    });
  }
  $('#printarea').innerHTML = h;
  setTimeout(()=>window.print(), 60);
}

$('#fileimp').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const arr = JSON.parse(rd.result);
      if(!Array.isArray(arr)) throw 0;
      if(confirm('Se van a fusionar '+arr.length+' registros con lo que ya tienes. Nada se borra: si algo existe en los dos lados, se queda la versión con más contenido. ¿Seguir?')){
        D = fusionar(D, arr); guardar(); render(); alert('Importado. Ahora hay '+procesos().length+' actividades.');
      }
    }catch(err){ alert('Ese archivo no tiene el formato esperado.'); }
    e.target.value='';
  };
  rd.readAsText(f);
};

/* ============================================================
   FUSIÓN SEGURA (protección anti-borrado)
   Principio: el contenido nunca pierde frente al vacío, sin importar
   las marcas de tiempo. Un ejemplar con la copia local vacía no puede
   arrasar lo que hay en la hoja.
   ============================================================ */
const clonar = o => JSON.parse(JSON.stringify(o));

function fusionarPasos(a=[], b=[]){
  const m = new Map();
  [...a, ...b].forEach(p => {
    if(!p || !p.id){ return; }
    const prev = m.get(p.id);
    if(!prev){ m.set(p.id, clonar(p)); return; }
    const gana = (p._m||0) >= (prev._m||0) ? p : prev;
    const otro = gana===p ? prev : p;
    const r = clonar(gana);
    if(!r.txt && otro.txt) r.txt = otro.txt;              // el texto nunca se pierde
    if(!r._del && otro._del && (otro._m||0) > (r._m||0)) r._del = true;
    m.set(p.id, r);
  });
  return [...m.values()];
}

function fusionarTareas(a=[], b=[]){
  const m = new Map();
  [...a, ...b].forEach(t => {
    if(!t || !t.id) return;
    const prev = m.get(t.id);
    if(!prev){ m.set(t.id, clonar(t)); return; }
    const gana = (t._m||0) >= (prev._m||0) ? t : prev;
    const otro = gana===t ? prev : t;
    const r = clonar(gana);
    if(!r.nombre && otro.nombre) r.nombre = otro.nombre;
    r.tareas = fusionarPasos(t.tareas||[], prev.tareas||[]);
    // salvaguarda: si la fusión quedó más pobre que cualquiera de los lados, se queda la más rica
    const maxLen = Math.max((t.tareas||[]).length, (prev.tareas||[]).length);
    if(r.tareas.filter(p=>!p._del).length === 0 && maxLen > 0){
      r.tareas = clonar(((t.tareas||[]).length >= (prev.tareas||[]).length) ? t.tareas : prev.tareas);
    }
    m.set(t.id, r);
  });
  return [...m.values()];
}

function fusionarRegistro(a, b){
  const gana = (a._m||0) >= (b._m||0) ? a : b;
  const otro = gana===a ? b : a;
  const r = clonar(gana);
  // campos de texto: el contenido gana sobre el vacío
  ['nombre','desc','notas','cat','sub','resp','invol','prio','ambito','correo'].forEach(k => {
    if((r[k]===undefined || r[k]==='' || r[k]===null) && otro[k]) r[k] = otro[k];
  });
  if(r._kind==='person') return r;
  r.actividades = fusionarTareas(a.actividades||[], b.actividades||[]);
  const maxT = Math.max((a.actividades||[]).length, (b.actividades||[]).length);
  if(r.actividades.filter(t=>!t._del).length === 0 && maxT > 0){
    r.actividades = clonar(((a.actividades||[]).length >= (b.actividades||[]).length) ? a.actividades : b.actividades);
  }
  // comentarios: unión sin duplicados
  const cs = [...(a.comments||[]), ...(b.comments||[])];
  const vistos = new Set();
  r.comments = cs.filter(c => { const k = (c.autor||'')+'|'+(c.fecha||'')+'|'+(c.txt||''); if(vistos.has(k)) return false; vistos.add(k); return true; });
  // borrado: solo se respeta si el lado que borró es el más reciente
  const delA = a._del && (a._m||0) >= (b._m||0), delB = b._del && (b._m||0) >= (a._m||0);
  r._del = !!(delA || delB);
  return r;
}

function fusionar(local, remoto){
  const m = new Map();
  (local||[]).forEach(r => { if(r && r.id) m.set(r.id, clonar(r)); });
  (remoto||[]).forEach(r => {
    if(!r || !r.id) return;
    const prev = m.get(r.id);
    m.set(r.id, prev ? fusionarRegistro(prev, r) : clonar(r));
  });
  return [...m.values()];
}

/* ============================================================
   SINCRONIZACIÓN
   ============================================================ */
const urlSync = () => { try{ return localStorage.getItem(KEY_URL)||''; }catch(e){ return ''; } };

/* Lectura por etiqueta <script> en vez de fetch.
   El navegador bloquea fetch hacia Apps Script cuando Google no devuelve la
   cabecera de origen cruzado; una etiqueta <script> no pasa por esa
   verificación, así que la lectura siempre llega. Requiere que doGet del
   Apps Script acepte el parámetro callback (ver archivo .gs adjunto). */
function leerHoja(url, ms){
  return new Promise((resolve, reject) => {
    const fn = 'pj_' + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36);
    const sc = document.createElement('script');
    let listo = false;
    const limpiar = () => { delete window[fn]; if(sc.parentNode) sc.parentNode.removeChild(sc); };
    const reloj = setTimeout(() => { if(!listo){ limpiar(); reject(new Error('La hoja no respondió a tiempo.')); } }, ms || 20000);
    window[fn] = datos => { listo = true; clearTimeout(reloj); limpiar(); resolve(datos); };
    sc.onerror = () => { if(!listo){ clearTimeout(reloj); limpiar(); reject(new Error('No se pudo contactar la hoja.')); } };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + fn + '&v=' + Date.now();
    document.body.appendChild(sc);
  });
}

/* Envío por formulario oculto en vez de fetch.
   Un formulario enviado a un marco invisible es una navegación normal, no una
   llamada de fondo, así que no pasa por la verificación de origen cruzado.
   Requiere que doPost del Apps Script lea el campo "datos" (ver archivo .gs). */
function enviarHoja(url, texto){
  return new Promise(resolve => {
    const nombre = 'pj_marco_' + Date.now().toString(36);
    const marco = document.createElement('iframe');
    marco.name = nombre; marco.style.display = 'none';
    document.body.appendChild(marco);
    const form = document.createElement('form');
    form.method = 'POST'; form.action = url; form.target = nombre; form.style.display = 'none';
    const campo = document.createElement('textarea');
    campo.name = 'datos'; campo.value = texto;
    form.appendChild(campo);
    document.body.appendChild(form);
    let listo = false;
    const terminar = () => {
      if(listo) return; listo = true;
      setTimeout(() => { if(form.parentNode) form.remove(); if(marco.parentNode) marco.remove(); }, 100);
      resolve();
    };
    marco.onload = terminar;
    setTimeout(terminar, 20000);
    form.submit();
  });
}

$('#btnConn').onclick = () => {
  abrirModal(`<h3>Conexión con Google Sheets</h3>
    <p class="hint">Pega aquí la URL de la aplicación web de Apps Script (termina en <code>/exec</code>).
    Es la misma que ya usas en consultorías. Se guarda en este navegador; en cada computadora hay que pegarla una vez.</p>
    <input class="inp" id="cnUrl" value="${esc(urlSync())}" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="mfoot"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="cnOk">Guardar</button></div>`);
  $('#cnOk').onclick = () => {
    const v = $('#cnUrl').value.trim();
    try{ localStorage.setItem(KEY_URL, v); }catch(e){}
    cerrarModal(); infoSync('Conexión guardada.');
  };
};

function infoSync(txt){ $('#syncinfo').textContent = txt; }

$('#syncbtn').onclick = async () => {
  const url = urlSync();
  if(!url){ $('#btnConn').click(); return; }
  const btn = $('#syncbtn');
  btn.disabled = true; infoSync('Trayendo…');
  try{
    let remoto = await leerHoja(url);
    if(typeof remoto === 'string'){ try{ remoto = JSON.parse(remoto); }catch(e){ remoto = []; } }
    if(!Array.isArray(remoto)) remoto = [];
    // salvaguarda de arranque: nunca subir una copia local vacía sobre una hoja con datos
    const localLlena = D.filter(r=>r._kind!=='person').length;
    const remotaLlena = remoto.filter(r=>r._kind!=='person').length;
    if(localLlena === 0 && remotaLlena > 0){
      D = remoto; guardar(); render();
      infoSync('Datos traídos de la hoja.'); btn.disabled=false; return;
    }
    D = fusionar(D, remoto);
    guardar();
    infoSync('Subiendo…');
    // Apps Script no devuelve cabeceras CORS al recibir datos, así que el envío
    // va en modo opaco: se manda y no se lee la respuesta. Por eso después se
    // vuelve a leer la hoja para confirmar que lo enviado llegó completo.
    await enviarHoja(url, JSON.stringify(D));
    const h = new Date().toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'});
    try{ localStorage.setItem(KEY_SYNC, h); }catch(e){}
    infoSync('Verificando…');
    render();
    await new Promise(r => setTimeout(r, 1800));
    let ok = false;
    try{
      let arr = await leerHoja(url, 12000);
      if(typeof arr === 'string') arr = JSON.parse(arr);
      ok = Array.isArray(arr) && arr.filter(r=>r._kind!=='person').length >= procesos().length;
    }catch(e){ ok = false; }
    if(ok){ infoSync('Sincronizado a las ' + h); }
    else {
      infoSync('Subida sin confirmar.');
      alert('Los datos se bajaron bien, pero no pude confirmar que la subida llegara completa a la hoja.\n\nTu trabajo está guardado en este navegador. Pulsa ↓ Exportar para tener un respaldo y vuelve a sincronizar en un momento.');
    }
  }catch(err){
    infoSync('No se pudo conectar.');
    alert('No se pudo sincronizar.\n\nRevisa dos cosas en el Apps Script:\n1. Que doGet acepte el parámetro callback y doPost lea el campo "datos" (archivo .gs adjunto).\n2. Que la implementación esté como "Ejecutar como: yo" y "Acceso: cualquiera", y que hayas pulsado Implementar.\n\nTu trabajo sigue guardado en este navegador. Pulsa ↓ Exportar para respaldarlo.\n\nDetalle: ' + err);
  }
  btn.disabled = false;
};

/* ============================================================
   ARRANQUE
   ============================================================ */
cargar();
render();
try{ const h = localStorage.getItem(KEY_SYNC); if(h) infoSync('Última sincronización: ' + h); }catch(e){}
</script>
